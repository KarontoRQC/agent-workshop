limit_req_zone $binary_remote_addr zone=agent_session_issue_per_ip:10m rate=3000r/m;
limit_req_zone $cookie_agent_session zone=agent_api_per_session:20m rate=300r/m;
limit_req_zone $cookie_agent_session zone=agent_chat_per_session:20m rate=30r/m;
limit_req_zone $cookie_agent_session zone=agent_tts_per_session:20m rate=60r/m;
limit_conn_zone $cookie_agent_session zone=agent_stream_per_session:20m;

server {
    server_name agent.xtznai.com;

    root /opt/20260715qr/agent/frontend;
    index index.html;
    server_tokens off;
    client_max_body_size 256k;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_proxied any;
    gzip_types application/javascript application/json application/xml image/svg+xml text/css text/plain text/xml;

    limit_req_status 429;
    limit_conn_status 429;

    include /etc/nginx/snippets/agent-security-headers.conf;

    location = /api/session {
        include /etc/nginx/snippets/agent-api-proxy.conf;
        include /etc/nginx/snippets/agent-security-headers.conf;
        limit_req zone=agent_session_issue_per_ip burst=1000 nodelay;
        proxy_buffering off;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
    }

    location = /api/coze/chat/stream {
        include /etc/nginx/snippets/agent-api-proxy.conf;
        include /etc/nginx/snippets/agent-security-headers.conf;
        client_max_body_size 128k;
        limit_req zone=agent_chat_per_session burst=10 nodelay;
        limit_conn agent_stream_per_session 4;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 180s;
        proxy_send_timeout 30s;
        add_header X-Accel-Buffering "no" always;
    }

    location = /api/tts/speech {
        include /etc/nginx/snippets/agent-api-proxy.conf;
        include /etc/nginx/snippets/agent-security-headers.conf;
        client_max_body_size 8k;
        limit_req zone=agent_tts_per_session burst=10 nodelay;
        proxy_buffering off;
        proxy_read_timeout 60s;
        proxy_send_timeout 30s;
    }

    location /api/ {
        include /etc/nginx/snippets/agent-api-proxy.conf;
        include /etc/nginx/snippets/agent-security-headers.conf;
        limit_req zone=agent_api_per_session burst=60 nodelay;
        proxy_buffering off;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location /agent-avatars/ {
        alias /opt/20260715qr/agent/agent-avatars/;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/agent-security-headers.conf;
    }

    location /assets/ {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/agent-security-headers.conf;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        include /etc/nginx/snippets/agent-security-headers.conf;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl http2; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/agent.xtznai.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/agent.xtznai.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    listen 80;
    server_name agent.xtznai.com;
    return 301 https://$host$request_uri;
}
